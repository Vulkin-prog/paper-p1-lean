version: v0.4
project:
  name: Exact finite affine spectra and canonical moment factorization
  description: Normalized uniform probabilities of arbitrary finite affine systems are zero exactly for
    incompatible prescriptions and otherwise equal the inverse power of two of the effective image rank.
    Actual effective-block indicators have their individual exact marginal rates. Their centered moment
    is the signed full-support character sum, with every affine sign and heterogeneous dimension retained.
    The relative nullity is the actual addition-kernel dimension and exact dimension deficit, giving the
    sharper factor 2^rho-1. A unique finest relation-respecting partition factors both ordinary and centered
    moments and adds the relative nullities. No independence, nominal-rank replacement or unformalized
    estimate is assumed.
  authors:
  - Brice Pouly
  author_identifiers:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
