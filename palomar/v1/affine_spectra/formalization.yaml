review:
  status: agent-reviewed
  notes: 'The four explicit statements and complete Solution compile with proof warnings as errors. All
    16 new theorem and bridge axioms pass a direct audit. Manual exports passed exact statement comparison
    and all six available checkers: Lean default, Lean paranoid, lean4lean, NanoDa, verified con-leche
    and verified con-ron. Frozen-root qualification and the complete Palomar workflow are recorded separately
    after actual success. Only the four selected Challenge theorem statements have deliberate holes.'
status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Quot.sound
  - Classical.choice
  scope: 'Four selected declarations: exact finite affine masses including incompatibility; actual marginal
    rates and full-support centered Fourier identity; sharp relative-nullity bound and full-support witness;
    unique finest canonical factorization of both moments and nullity. These finite interfaces contain
    no unformalized estimate. No registration or certification is claimed.'
fidelity:
  divergences: Every block is its actual effective dual subspace with its own inverse-cardinality marginal,
    also identified with its effective rank. The affine prescription is locally compatible in each effective
    block; joint incompatibility is retained by the signed full-support sum. The sharp 2^rho-1 bound explicitly
    requires a nonempty index family. The unique finest partition is defined by restriction of every actual
    zero-sum relation. No direct identification with the infinite arithmetic run law is asserted by these
    finite interfaces.
