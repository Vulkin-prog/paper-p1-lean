automation:
  methods:
    - method: agent
      framework: Codex
      models: [OpenAI Codex agents]
      prompting_notes: >-
        Preserve literal kernel and integer bins, heterogeneous parameter
        ranges, quantifier order and the distinction between counts and
        the exact comparison of their displayed exponents.
      tool_setup: >-
        Lean proof construction, standalone statement extraction, exact
        source-to-interface bridges and explicit counterexample review.
  notes: Agent assistance is not independent human peer review.
review:
  status: agent-reviewed
  notes: >-
    All four Solution proofs compile without placeholders or warnings under
    Lean v4.36.0-rc2. The standalone Mathlib-only Challenge has four deliberate
    selected theorem holes. Statement comparison and kernel replays are
    recorded separately when they succeed; compilation alone is not claimed
    as Palomar qualification.
status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  scope: >-
    Four selected declarations for the actual prescribed-kernel count,
    capped comparison, exact nonnegative-parameter criterion and actual
    arbitrarily large counterexamples to the unqualified comparison.
    Deliberate holes occur only in the standalone Challenge. No registry
    entry, editorial decision or certification is claimed.
fidelity:
  divergences: >-
    The shift bound is generalized to every fixed polylogarithmic budget.
    Both counting branches and their uncapped minimum remain valid.
    Adding the trivial exponent one repairs the universal exact comparison.
    Necessity of the uncapped range is restricted to nonnegative delta,
    as required by actual positive divisors at N>=2. The counterexample
    refutes the exact comparison rather than the counting estimates.
