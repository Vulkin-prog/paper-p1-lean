version: v0.4
project:
  name: Asymmetric parity-space profiles with the necessary alignment radius
  description: >-
    Uniformly bound the full exponential even-selection loss profile by
    N^(31/24+epsilon) for arbitrary old sets contained in intervals of radius
    D(L+1), when nonalignment uses the same radius. Old centres lie in a fixed
    expansion [N,N+QN), new centres in [N,2N), and the prime cutoff obeys
    (2D+1)(L+1)<=H<=Dcut(L+1). One threshold precedes all critical lengths,
    cutoffs and old sets. Parity vectors, raw old value spans and the actual
    even-selection preimage are defined explicitly over F2. Adjoining small
    prime coordinates leaves the loss unchanged. A separate actual profile
    with old radius 3(L+1) proves that radius-one exclusion cannot give the
    original exponent, for any fixed cutoff multiple. All estimates and
    the counterexample are proved without unformalized mathematical inputs.
  authors: [Brice Pouly]
  author_identifiers:
    - name: Brice Pouly
      github: Vulkin-prog
      orcid: 0009-0008-8491-2467
  responsible_maintainers: [Brice Pouly]
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv: [math.NT]
sources:
  - title: Sharp Poisson approximation and second-order correction for long multiplicative runs, technical companion, version 1.7 draft
    authors: [Brice Pouly]
    id: https://github.com/Vulkin-prog/paper-p1-lean
    type: paper
    relationship: formalizes
    location: >-
      Corrected T1.10 in companion_sections/arithmetic_appendix.tex and
      the formalization appendix. P1-MATH-0162 records the radius-one
      obstruction, P1-MATH-0446 the unconditional corrected profiles,
      and P1-MATH-0984 their exact revised statement aliases.
    note: >-
      The original version 1.6 radius-one statement remains preserved
      with its checked counterexample. Version 1.7 matches the exclusion
      radius to the actual old enclosing interval. No publication
      identifier is asserted for this working manuscript.
