automation:
  methods:
    - method: agent
      framework: Codex
      models: [OpenAI Codex agents]
      prompting_notes: >-
        Formalization and source review under the author's requested Lean
        version, with explicit quantifier order and source corrections.
      tool_setup: >-
        Lean proof construction, exact source-to-interface bridges, complete
        source inventory, kernel axiom audits and paired statement preparation.
  notes: Agent assistance is not independent human peer review.
review:
  status: agent-reviewed
  notes: >-
    The three Solution proofs compile without placeholders or warnings under
    Lean v4.36.0-rc2. The Challenge imports only Mathlib and has exactly the
    three intentional selected statement holes. Comparator, independent kernel
    replay and complete Palomar mechanical preflight are recorded separately
    when performed; compilation alone is not claimed as qualification.
status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  scope: >-
    Three selected analytic declarations, with no unformalized mathematical
    premise. Intentional proof holes occur only in the standalone Challenge.
    This selection does not represent all 167 numbered manuscript statements.
    No registration, registry identifier, editorial decision or certification
    is claimed at preparation.
fidelity:
  divergences: >-
    The census uses the literal length floor(log N/(4 log 2)) and ordinary
    smoothness, including prime two. It asserts two candidates almost
    everywhere, not a Dickman relative-density asymptotic. The analytic
    estimate concerns off-central frequencies; no fixed central-frequency
    decay is claimed. The mean-square comparison is for the displayed
    Gaussian averages, not sharp interval averages. These suffice for the
    source census used by T19.17.
