version: v0.4
project:
  name: Actual factorial cumulants and the optimal third-cumulant power for multiplicative
    runs
  description: In the literal independent prime-sign model, the complete multiplicative-run
    count has a third factorial cumulant of optimal positive power N^(-41/30). Its positive
    lower constant depends only on the critical band, before the upper epsilon margin. The
    actual second cumulant has its exact moving residue-dependent equivalent, with the literal
    coefficient and nominal mean. All falling-factorial observables are integrable and have
    the exact subset expansion in actual joint start probabilities. Complete third- and fourth-cumulant
    identities retain heterogeneous window means, pair-square, triple, pair and diagonal repeated-index
    terms. No nominal marginal replacement, compatibility omission or unformalized mathematical
    input is assumed.
  authors:
  - Brice Pouly
  author_identifiers:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv:
  - math.NT
  - math.PR
sources:
- title: Sharp Poisson approximation and second-order correction for long multiplicative runs,
    version 1.7 draft
  authors:
  - Brice Pouly
  id: https://github.com/Vulkin-prog/paper-p1-lean
  type: paper
  relationship: formalizes
  location: Main theorem 14.1, the second-cumulant phase equivalent from theorem 3.3, and
    the exact factorial and heterogeneous cumulant identities underlying main 11.3 and 16.1;
    version 1.7 draft.
  note: The full count includes both signs and its preceding opposite-sign boundary. The leading
    lower constant for the third cumulant is independent of the upper exponent margin. This
    is a working manuscript without an asserted publication identifier.
related_formalizations:
- id: https://github.com/Vulkin-prog/paper-c-lean
