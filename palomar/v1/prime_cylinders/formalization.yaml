fidelity:
  divergences: These are finite refinements of companion T19.7. The complete even-valuation set replaces
    its sufficient coprime subfamily; the supported cutoff uses only required integers; the full forcing
    fiber replaces one prime-sign atom. No improved t threshold, general explicit exact rank, expected-count
    density or uniformly relative growing-prime error is asserted. All numbered statements are preserved.
