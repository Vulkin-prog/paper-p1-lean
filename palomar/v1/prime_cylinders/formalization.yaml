version: v0.4
project:
  name: Effective valuation cylinders and affine-rank moment bounds
  description: Literal independent fair prime-sign values and full positive/total run counts are explicit.
    The complete retained set consists of multipliers with even q-adic valuation. Every finite depth gives
    the exact geometric lower budget with endpoint error 3*k. An explicit logarithmic depth yields a two-sided
    count, fixed-prime density 1/(q+1), and a uniform absolute normalized error with a threshold independent
    of the prime. The actual finite forcing event is a compatible affine fiber with normalized cardinality
    exactly 2^(-rank). Both actual full exponential moments inherit the effective-rank cost, at most the
    supported prime-count cost. The five-start N=18,q=3 example leaves prime 19 free and proves the numerical
    bound exp(5*t)/1024 for both moments, at least twice the previous same-count atom bound.
  authors:
  - Brice Pouly
  author_identifiers:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv:
  - math.PR
  - math.NT
sources:
- title: Sharp Poisson approximation and second-order correction for long multiplicative runs, version
    1.7 draft
  authors:
  - Brice Pouly
  id: https://github.com/Vulkin-prog/paper-p1-lean
  type: paper
  relationship: formalizes
  location: 'Companion proposition T19.7 and its unnumbered version 1.7 formalization appendix: checked
    refinements P1-MATH-0988 through P1-MATH-0991.'
  note: The actual retained sets, finite prime-bit vectors, affine forcing equations and normalized event
    cardinality are Mathlib-only definitions. Compatibility and every count, density and moment bound
    are proved from the arithmetic model. The original t>2 asymptotic theorem and all numbered statement
    blocks are preserved. Uniformity concerns absolute normalized error; no growing-prime relative error
    or general exact rank formula is asserted.
