version: v0.4
project:
  name: Exact centered and stopped expansions for dependent indicator counts
  description: For arbitrary dependent measurable Boolean indicators on any probability space, the literal
    finite count law has its exact expansion with every heterogeneous marginal retained. An arbitrary
    hereditary retained class gives the first-excluded-prefix identity over a commutative semiring. Its
    remainder is a sum of convolutions with genuinely positive kernels whose coefficients are actual prefix/suffix
    joint expectations. Each kernel has both mass and ordinary unweighted l1 norm equal to the prefix
    activation probability. The resulting error bound has no suffix-size factor and assumes no independence
    or unformalized estimate.
  authors:
  - Brice Pouly
  author_identifiers:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv:
  - math.PR
  - math.CO
sources:
- title: Sharp Poisson approximation and second-order correction for long multiplicative runs, version
    1.7 draft
  authors:
  - Brice Pouly
  id: https://github.com/Vulkin-prog/paper-p1-lean
  type: paper
  relationship: formalizes
  location: Main proposition 4.1, lemma 5.1 and proposition 5.2, including exact original count probabilities,
    retained-reference mass, positive dependent-suffix kernels and ordinary l1 remainder bound; version
    1.7 draft.
  note: The displayed first-excluded-prefix identity is a specialization of the abstract lace expansion.
    Exact heterogeneous marginals and actual dependent suffix probabilities are retained.
