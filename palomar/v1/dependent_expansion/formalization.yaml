  type: paper
  relationship: adapts
  location: Author version, formula (*), page 1.
  note: 'The hereditary first-excluded-prefix map specializes the general lace identity. No claim to formalize
    all lace-map or sieve results is made. Author version: https://sites.math.rutgers.edu/~zeilberg/mamarim/mamarimPDF/lace.pdf'
automation:
  methods:
  - method: agent
    framework: Codex
    models:
    - OpenAI Codex agents
    prompting_notes: Use literal finite count probabilities and actual Bochner joint/centered moments.
      Retain heterogeneous marginals and all dependence. Define the ordinary singleton l1 norm explicitly;
      show each positive remainder kernel coefficient and its exact mass. Keep only the first excluded
      prefix and leave the suffix unexpanded.
    tool_setup: Lean proof construction, explicit Mathlib-only source definitions, exact bridges to the
      substantive proof and full axiom audits.
  notes: Agent assistance is not independent human peer review.
review:
  status: agent-reviewed
  notes: All four explicit statements and their complete Solution compile. Manual exports passed statement
    comparison and Lean, NanoDa and verified con-ron; all 13 new theorem axioms were audited. Frozen-root
    build, standard Comparator qualification and the complete Palomar workflow are recorded separately
    after actual success. Only the four selected Challenge theorem statements have deliberate holes.
status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Quot.sound
  - Classical.choice
  scope: 'Four selected declarations: general stopped polynomial expansion; exact centered count law with
    actual coefficients and probability status; positive stopped kernels with exact coefficients, mass
    and norm; ordinary l1 error bound. Complete Solution without proof holes; no registry entry or certification
    is claimed.'
fidelity:
  divergences: The finite polynomial identity is proved already over a commutative semiring. The probability
    identities apply to arbitrary dependence on an arbitrary probability space with a finite index carrier.
    The retained reference has total mass one but may have negative coefficients. Every kernel retains
    its actual dependent suffix; the norm is ordinary unweighted l1.
