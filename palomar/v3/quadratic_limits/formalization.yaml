version: v0.4
project:
  name: 'P1 V2: Optimal quadratic approximation and Poisson scales'
  description: The full original run-count law has optimal quadratic Poisson–Charlier error with exact
    mean and second factorial cumulant, a uniform mean-bias bound and eventual probability status. Exact
    and nominal Poisson total variation have their distinct remainder powers and the same moving residue
    equivalent. Every fixed polynomial weight and factorial moment, the zero-count probability, and the
    literal integer quantization and cost of replacing the exact mean are recorded.
