fidelity:
  divergences: Literal self-contained Mathlib-only Challenge models are identified with the existing substantive
    proofs by explicit checked bridges. Finite inequalities may strengthen printed asymptotic forms by
    choosing unit upper constants after a larger threshold. Lemma5.1 is strengthened to a universal constant
    without a mean cap; Theorem5.2 retains its 254 printed hypotheses. Coverage is claimed only for the
    numbered main results explicitly mapped here; companion proofs are used as dependencies, without claiming
    separate direct registration of all92 companion results.
