version: v0.4
project:
  name: 'P1 publication: Arithmetic pair profiles and finite channel heights'
  description: Positive and signed arithmetic profiles over ordered separated pairs of multiplicative
    runs, including both moving residue phases and the explicit two-channel probability law. Every fixed
    finite channel-height truncation has a literal next-height cumulant and law remainder and a sharp
    total-variation equivalent. Weighted nonaligned pairs, the closed height-five correction, and the
    height-six phase are included with their exact coefficients.
