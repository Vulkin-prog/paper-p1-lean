fidelity:
  divergences: Literal Mathlib-only models are connected to the substantive parent development by checked
    bridges. Printed asymptotic constants can be absorbed into a larger threshold using the positive exponent
    margin; the Lean inequalities then have unit constant. All thirteen old remaining main-result clauses
    are preserved as conjunction fields, with unchanged hypotheses and fixed-versus-growing-order quantifiers.
    The fixed-height Hermite equivalent is sharp; only an upper bound is claimed for the exact-parameter
    Hermite law. For companion13.1 the exact nominal weighted ordered-list sum includes all cardinalities,
    with one scale threshold before every minimum size and dyadic subset; local regularity and strict
    distances>L remain in the literal list filter. There is no primitivity or affine-compatibility assumption,
    and no pure N^-2 endpoint. For companion15.1, the finite signed perturbation is normalized and nonnegative,
    all displayed factorial and exponential series are summable, and the sequence has explicit harmless
    Poisson(1) initial terms. The counterexample has no claimed multiplicative realization. The companion92
    results are not all claimed as directly registered. Main Theorem5.2 remains explicitly conditional
    in its unchanged, already published dossier.
