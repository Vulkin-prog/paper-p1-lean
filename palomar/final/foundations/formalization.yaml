version: v0.4
project:
  name: 'P1: uniform event calculus, Hermite laws and the fixed-moment obstruction'
  description: Quantitative Poisson approximation for long multiplicative runs requires arithmetic control
    uniform over growing subfamilies. The selected results give the exact affine event calculus, homogeneous
    and compatible-nullity envelopes, unique relation-respecting component factorization, and a weighted
    full-support count summed over all cardinalities with one threshold before every subset and minimum
    size; actual positive Hermite reference laws with an exact-parameter N^(-4/3+epsilon) upper error
    bound and fixed-height sharp moving total-variation equivalents; and an explicit counterexample showing
    that agreement at every fixed factorial-moment order, even with uniform exponential-moment control,
    does not imply any inverse-power total-variation rate. The quadratic positivity interval and singleton
    identity calibrate the positive-reference family. The counterexample is an independently constructed
    family of probability laws; no multiplicative realization is asserted. The selected conjunctions cover
    main results 2.1--2.5, 7.1 and 8.4 and companion Propositions13.1 and15.1, including the latter's
    displayed sequence corollary.
