name: Lean and source integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  # Preserve a running cold proof build while the newest update waits its turn.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only immutable evidence snapshots
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          receipts = [*Path('palomar/v1').glob('*/qualification.json'),
                      *Path('palomar/v2').glob('*/qualification.json')]
          sources = {json.loads(path.read_text())['source_commit'] for path in receipts}
          for source in sorted(sources):
              if not re.fullmatch('[0-9a-f]{40}', source):
                  raise SystemExit('Invalid evidence source commit')
              available = subprocess.run(
                  ['git', 'cat-file', '-e', source + ':docs/axiom-audit-declarations.json'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if available.returncode:
                  subprocess.run(['python3', 'scripts/check_disk.py'], check=True)
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', source], check=True)
                  subprocess.run(['python3', 'scripts/check_disk.py'], check=True)
          PY
      - name: Check disk and manuscript identities
        run: |
          python3 scripts/check_disk.py
          python3 scripts/check_sources.py
          python3 scripts/check_revised_sources.py --require-proved
          python3 scripts/check_manuscript_endpoints.py
          python3 scripts/check_manuscript_v20.py
          python3 -m unittest discover -s tests -p test_manuscript_v20.py
          python3 -m unittest discover -s tests -p test_sharp_palm_scope.py
          python3 scripts/check_editorial_previews.py
          python3 -m unittest discover -s tests -p test_editorial_previews.py
          python3 scripts/check_scientific_preview.py
          python3 -m unittest discover -s tests -p test_scientific_preview.py
          python3 scripts/check_unified_preview.py
          python3 -m unittest discover -s tests -p test_unified_preview.py
          python3 scripts/update_audit.py --check
          python3 scripts/check_registry_candidates.py
          python3 scripts/check_registry_consolidation.py
          python3 scripts/check_palomar_sources.py
          python3 scripts/check_registry_evidence.py --require-all
      - name: Install elan from its official repository
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download only the required Mathlib cache
        run: |
          python3 scripts/cache_dependencies.py
          python3 scripts/check_disk.py
      - name: Build with warnings as errors
        run: lake build
      - name: Check declaration axioms
        run: |
          lake env lean Audit.lean > axiom-audit.txt
          cat axiom-audit.txt
          python3 scripts/check_axioms.py axiom-audit.txt
