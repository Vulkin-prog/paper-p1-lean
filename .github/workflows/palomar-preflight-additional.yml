name: Additional P1 Palomar mechanical preflight
run-name: Additional P1 preflight — ${{ inputs.family }} at ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full immutable source commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      family:
        description: Candidate family, or all families at the same source commit
        required: true
        default: all
        type: choice
        options:
          - all
          - factorial_cumulants
          - moment_obstruction
          - dependent_expansion
          - integral_curve_count
          - affine_spectra
          - exponential_divergence
          - local_rigidity
          - prime_cylinders
      authorization_relationship:
        description: Confirmed human relationship to the substantive formalization
        required: true
        type: choice
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Validate exact source, confirmed relationship and family selection
        id: selection
        env:
          P1_SOURCE: ${{ inputs.source_commit }}
          P1_FAMILY: ${{ inputs.family }}
          P1_RELATIONSHIP: ${{ inputs.authorization_relationship }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          source = os.environ['P1_SOURCE']
          family = os.environ['P1_FAMILY']
          relationship = os.environ['P1_RELATIONSHIP']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise SystemExit('source_commit must be a full lowercase commit SHA')
          if relationship not in {
              'I am a responsible author or maintainer',
              'I have approval from a responsible author or maintainer',
          }:
              raise SystemExit('An explicit supported human relationship is required')
          families = ['factorial_cumulants', 'moment_obstruction', 'dependent_expansion', 'integral_curve_count', 'affine_spectra', 'exponential_divergence', 'local_rigidity', 'prime_cylinders']
          if family != 'all' and family not in families:
              raise SystemExit('Unknown candidate family')
          selected = families if family == 'all' else [family]
          matrix = {'include': []}
          for slug in selected:
              identity = hashlib.sha256((source + ':' + slug).encode()).hexdigest()[:10]
              matrix['include'].append({
                  'family': slug,
                  'request_id': 'p2' + identity,
                  'options': {
                      'comparator_config_path': 'comparator/p1_' + slug + '.json',
                      'formalization_metadata_path': 'palomar/v1/' + slug + '/formalization.yaml',
                      'authorization_relationship': relationship,
                  },
              })
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY
  verify:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.source_commit }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: ${{ matrix.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ toJSON(matrix.options) }}
